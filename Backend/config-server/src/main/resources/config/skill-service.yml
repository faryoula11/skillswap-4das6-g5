# Configuration centralisée de MS2 - skill-service (MySQL skill_db)
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/skill_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: skill-service
    version: 1.0.0
    description: Microservice de gestion des competences (SkillSwap)
    team: 4DAS6-G5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
