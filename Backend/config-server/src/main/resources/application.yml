server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Profil native activé par défaut : charge les configurations depuis le dossier classpath:/config
    # Permet un fonctionnement autonome sans dépendance Git externe
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always

---
# Profil Git optionnel si l'équipe souhaite brancher un dépôt distant ultérieurement
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/faryoula11/skillswap-4das6-g5.git
          search-paths: Backend/config-server/src/main/resources/config
          default-label: main
