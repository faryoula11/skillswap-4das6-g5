spring.application.name=exchange-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/skillswap_exchange_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/skillswap

springdoc.swagger-ui.oauth.client-id=skillswap-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true