
# Nom du microservice
spring.application.name=ApiGatewayE

# Port API Gateway
server.port=8090

# Connexion à Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Route vers Exchange Service
spring.cloud.gateway.server.webflux.routes[0].id=exchange-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EXCHANGE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/exchanges/**

# Route vers les séances de formation
spring.cloud.gateway.server.webflux.routes[1].id=training-sessions
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EXCHANGE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/training-sessions/**


spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:8083
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*



spring.cloud.gateway.server.webflux.routes[2].id=exchange-auth
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EXCHANGE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**
